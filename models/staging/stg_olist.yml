version: 2

models:
  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                         'invoiced', 'processing', 'created', 'approved']

  - name: stg_customers
    description: One row per order-specific customer_id. customer_unique_id identifies the real person.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category_name_english
        data_tests: [not_null]

  - name: stg_product_category_translation
    columns:
      - name: product_category_name
        data_tests: [unique, not_null]

  - name: stg_geolocation
    description: One row per zip code prefix (averaged coordinates, most frequent city).
    columns:
      - name: zip_code_prefix
        data_tests: [unique, not_null]

  - name: stg_order_items
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

  - name: stg_order_payments
    columns:
      - name: payment_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_order_reviews
    description: One row per order (latest review kept).
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]